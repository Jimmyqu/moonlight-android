name: Build custom Moonlight APK

on:
  workflow_dispatch:
  push:
    branches: [ custom-back-to-home ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Build non-root debug APK
        run: ./gradlew assembleNonRootDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-back-to-win-home
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
